<body style="margin:0; background-color:#010409;">
  <div id="root">
    <!-- Pre-React Loading Screen — replaced automatically when React mounts -->
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #010409;
        background-image:
          radial-gradient(at 0% 0%, rgba(29, 78, 216, 0.15) 0px, transparent 50%),
          radial-gradient(at 100% 0%, rgba(30, 58, 138, 0.1) 0px, transparent 50%),
          radial-gradient(circle at 50% 50%, #020617 0%, #010409 100%);
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        overflow: hidden;
      }

      /* Animated glow ring */
      .loader-ring {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        border: 3px solid rgba(59, 130, 246, 0.1);
        border-top-color: #3b82f6;
        animation: spin 0.8s linear infinite;
        margin-bottom: 40px;
        box-shadow: 0 0 30px -5px rgba(59, 130, 246, 0.3);
      }

      /* Name heading */
      .loader-name {
        font-size: clamp(1.5rem, 4vw, 2.5rem);
        font-weight: 900;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        background: linear-gradient(135deg, #60a5fa, #818cf8, #3b82f6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: fadeSlideUp 0.8s ease-out both;
        margin: 0;
      }

      /* Subtitle / tagline */
      .loader-tagline {
        font-size: clamp(0.7rem, 1.5vw, 0.9rem);
        color: rgba(148, 163, 184, 0.7);
        letter-spacing: 0.35em;
        text-transform: uppercase;
        margin-top: 12px;
        animation: fadeSlideUp 0.8s ease-out 0.2s both;
      }

      /* Bottom accent line */
      .loader-line {
        position: absolute;
        bottom: 60px;
        width: 60px;
        height: 2px;
        background: linear-gradient(90deg, transparent, #3b82f6, transparent);
        animation: pulse-line 2s ease-in-out infinite;
      }

      /* Floating particles */
      .loader-particle {
        position: absolute;
        width: 4px;
        height: 4px;
        background: rgba(59, 130, 246, 0.3);
        border-radius: 50%;
        animation: float-up 3s ease-in-out infinite;
      }

      .loader-particle:nth-child(1) {
        left: 20%;
        animation-delay: 0s;
        animation-duration: 3.5s;
      }

      .loader-particle:nth-child(2) {
        left: 40%;
        animation-delay: 0.8s;
        animation-duration: 2.8s;
      }

      .loader-particle:nth-child(3) {
        left: 60%;
        animation-delay: 1.6s;
        animation-duration: 3.2s;
      }

      .loader-particle:nth-child(4) {
        left: 80%;
        animation-delay: 0.4s;
        animation-duration: 4s;
      }

      .loader-particle:nth-child(5) {
        left: 50%;
        animation-delay: 1.2s;
        animation-duration: 3s;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes fadeSlideUp {
        from {
          opacity: 0;
          transform: translateY(16px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes pulse-line {

        0%,
        100% {
          opacity: 0.3;
          transform: scaleX(1);
        }

        50% {
          opacity: 1;
          transform: scaleX(1.5);
        }
      }

      @keyframes float-up {
        0% {
          transform: translateY(100vh) scale(0);
          opacity: 0;
        }

        20% {
          opacity: 1;
        }

        100% {
          transform: translateY(-20vh) scale(1);
          opacity: 0;
        }
      }
    </style>
    <div id="preloader" aria-label="Loading portfolio">
      <div class="loader-particle"></div>
      <div class="loader-particle"></div>
      <div class="loader-particle"></div>
      <div class="loader-particle"></div>
      <div class="loader-particle"></div>
      <div class="loader-ring"></div>
      <h1 class="loader-name">Abenezer Aschalew</h1>
      <p class="loader-tagline">Loading Portfolio</p>
      <div class="loader-line"></div>
    </div>
  </div>
